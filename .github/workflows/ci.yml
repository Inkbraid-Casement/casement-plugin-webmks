name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the builtin-baseline in vcpkg.json.
  VCPKG_COMMIT_ID: "11121428426dfd091ed52a01288b98d79da71671"
  # vcpkg removed its GitHub Actions cache backend; built packages are kept
  # in a folder that actions/cache saves instead.
  VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-binary-cache,readwrite"

jobs:
  windows:
    name: Windows build (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Cache the vcpkg builds
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-binary-cache
          key: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
      - name: Configure
        shell: bash
        run: |
          mkdir -p /c/vcpkg-binary-cache
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -L unit
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/vmware | Out-Null
          Copy-Item build/casement-vmware.exe, plugin.json, icon.png, LICENSE, README.md, CHANGELOG.md dist/vmware/
      - uses: actions/upload-artifact@v4
        with:
          name: casement-vmware-windows-x64
          path: dist/

  linux:
    name: Cross build and end-to-end tests (MinGW, Wine)
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      # No Mono or Gecko installer when Wine sets up its prefix.
      WINEDLLOVERRIDES: "mscoree,mshtml="
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          # wine64 alone has no wine command: that comes from the wine package.
          sudo apt-get install -y --no-install-recommends mingw-w64 wine64 wine ninja-build cmake nasm \
            xvfb x11vnc tigervnc-scraping-server x11-utils x11-xserver-utils xdotool xterm imagemagick
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/fake-esxi/go.mod
          cache-dependency-path: tools/fake-esxi/go.sum
      - name: Restore third-party builds
        uses: actions/cache@v4
        with:
          path: ~/mingw64
          key: mingw64-${{ hashFiles('ci/mingw-deps.sh') }}
      - name: Third-party libraries
        run: ci/mingw-deps.sh ~/mingw64 zlib libjpeg_turbo libvncserver
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_PREFIX_PATH=$HOME/mingw64
      - name: Build
        run: cmake --build build
      - name: Wine prefix
        run: wineboot --init && wineserver --wait
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -L unit
      - name: End-to-end tests
        env:
          CASEMENT_E2E: "1"
        run: ci/e2e.sh build
